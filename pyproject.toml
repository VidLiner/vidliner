[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidliner"
version = "0.1.0"
description = "Object-centric synthetic data augmentation pipeline with mandatory verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VidLiner contributors" }]
keywords = ["computer-vision", "data-augmentation", "training-data", "quality-assurance", "dag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "typer>=0.12.3",
  "PyYAML>=6.0.1",
  "numpy>=1.26",
  "Pillow>=10.3",
]

[project.optional-dependencies]
cv = ["opencv-python-headless>=4.9"]
http = ["httpx>=0.27"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "ty>=0.0.1",
]
all = [
  "opencv-python-headless>=4.9",
  "httpx>=0.27",
]

[project.scripts]
vidliner = "vidliner.cli.main:app"

[project.urls]
Documentation = "https://example.invalid/vidliner/docs"

[tool.setuptools.packages.find]
include = ["vidliner*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
redundant-cast = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "contract: backend contract tests",
  "pipeline: end-to-end pipeline tests",
  "slow: tests that take more than a second",
]
filterwarnings = ["error::DeprecationWarning:vidliner.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["vidliner", "tests"]
# `docs/` holds Python examples inside Markdown fenced blocks. They are illustrations, not modules:
# their alignment mirrors the prose around them, and reformatting them would make the two language
# versions diverge for no reason. The example scripts under `examples/` are linted, only not
# reflowed -- they are read as documentation.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "TID", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # Typer uses function calls in argument defaults
  "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005", "SLF001"]
# The example scripts bootstrap their own import path so they run from a bare checkout; the imports
# that follow the bootstrap are deliberately not at the top of the file.
"examples/**" = ["E402"]
"vidliner/core/errors.py" = ["N818"]
"vidliner/pipeline/executor.py" = ["N818"]
"vidliner/domain/reasons.py" = ["RUF022"]
"vidliner/backends/imageops.py" = ["RUF046"]

[tool.ruff.lint.isort]
known-first-party = ["vidliner"]

# Type checking is performed by `ty` (see [tool.ty.*] above). `mypy` is not configured because its
# numpy stubs require Python 3.12+ while the package targets 3.11; `ty` checks the same package
# against the 3.11 language level and passes with no diagnostics.

